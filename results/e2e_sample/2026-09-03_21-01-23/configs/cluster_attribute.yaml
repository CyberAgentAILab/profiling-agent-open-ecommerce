attribute_branches:
- name: demographic
  out_dir: ./results/e2e_sample/2026-09-03_21-01-23/outputs/clustering/demographic
  target_patterns:
  - user_attribute_demographic
  cache_embedding_path: ./results/e2e_sample/2026-09-03_21-01-23/outputs/embedding_cache/demographic
  n_clusters: 2
- name: psycho_behavioral
  out_dir: ./results/e2e_sample/2026-09-03_21-01-23/outputs/clustering/psycho_behavioral
  target_patterns:
  - user_attribute_psycho_behavioral
  cache_embedding_path: ./results/e2e_sample/2026-09-03_21-01-23/outputs/embedding_cache/psycho_behavioral
  n_clusters: 3
- name: life_event
  out_dir: ./results/e2e_sample/2026-09-03_21-01-23/outputs/clustering/life_event
  target_patterns:
  - user_attribute_life_event
  cache_embedding_path: ./results/e2e_sample/2026-09-03_21-01-23/outputs/embedding_cache/life_event
  n_clusters: 2
out_dir: ./results/e2e_sample/2026-09-03_21-01-23/outputs/clustering
log_dir: ./results/e2e_sample/2026-09-03_21-01-23/logs/clustering
model_name: ./models/Qwen3-Embedding-0.6B
torch_dtype: bfloat16
embedding_backend: qwen3_embedding
qwen3_max_length: 8192
enable_cache: true
batch_size: 100
query_path: ./results/e2e_sample/2026-09-03_21-01-23/outputs/user
algorithm: kmeans
n_clusters: 3
seed: 3407
dimension_reduction: none
minibatch_kmeans_batch_size: 1024
minibatch_kmeans_max_iter: 300
minibatch_kmeans_n_init: 10
minibatch_kmeans_max_no_improvement: 10
minibatch_kmeans_reassignment_ratio: 0.01
pca_n_components: 8
pca_random_state: 0
umap_n_components: 8
umap_min_dist: 0.1
umap_n_neighbors: 5
umap_metric: cosine
min_cluster_ratio: 0.01
min_samples: 2
metric: euclidean
cluster_selection_method: eom
hdbscan_n_jobs: -1
