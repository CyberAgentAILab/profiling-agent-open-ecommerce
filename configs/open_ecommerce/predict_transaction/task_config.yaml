out_dir: ./results/open_ecommerce/transaction
log_dir: ./logs/open_ecommerce/transaction

use_validation_data: True
validation_path: ./results/open_ecommerce/search

model_name: ./models/Qwen3.5-4B
# model_name: ./models/Qwen3.5-27B  # model used in the paper
torch_dtype: bfloat16
# max_new_tokens caps the response only (SamplingParams.max_tokens).
# max_model_len caps prompt + response (vLLM max_model_len).
max_new_tokens: 8192
max_model_len: 16384
temperature: 0.0
top_p: 0.8
top_k: 20
min_p: 0.0
enable_cache: True
enable_thinking: False

query_path: ./results/open_ecommerce/search
is_reverse: False

debug_num_sample: 1000000

# canonical_product schema
json_schema_transaction:
  - reasoning
  - canonical_name
  - category_inferred
  - use_case
  - household_signals

prompt_recovery_transaction_path: ./configs/prompt/open-ecommerce/canonical_product.txt

use_vllm: True
batch_size: 1000
tensor_parallel_size: 1
trust_remote_code: True
seed: 3407
gpu_memory_utilization: 0.9
enforce_eager: True
enable_prefix_caching: False

begin:
end:
