# E2E sample run: scan the 10 sample titles with the local model.
out_dir: ./results/e2e_sample/scan
log_dir: ./logs/e2e_sample/scan

use_validation_data: False
validation_path: ""
query_path: ./results/e2e_sample/prepare_titles/titles_sample10.csv

is_reverse: False

model_name: ./models/Qwen3.5-4B
# model_name: ./models/Qwen3.5-27B  # model used in the paper
torch_dtype: bfloat16
# max_new_tokens caps the response only (SamplingParams.max_tokens).
# max_model_len caps prompt + response (vLLM max_model_len).
max_new_tokens: 512
max_model_len: 8192
do_sample: True
temperature: 0.0
top_p: 0.9
enable_cache: True
enable_thinking: False

prompt_path: ./configs/prompt/open-ecommerce/scan_diagnostic.txt

debug_num_sample: 10

# additional schema keys for is_diagnostic gate
json_schema_scan:
  - need_search
  - is_diagnostic
  - diagnostic_for
  - reason

yes_tokens:
  - "yes"

use_vllm: True
batch_size: 10
tensor_parallel_size: 1
trust_remote_code: True
seed: 3407
gpu_memory_utilization: 0.9
enforce_eager: True

begin:
end:
