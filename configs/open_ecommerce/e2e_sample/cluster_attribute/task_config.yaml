# E2E sample run: cluster the free-description attributes of the 10 sample products.
# Same three branches as the full pipeline, but k-means with a fixed number of
# clusters per attribute group (the sample is far too small for HDBSCAN/UMAP).
attribute_branches:
  - name: demographic
    out_dir: ./results/e2e_sample/clustering/demographic
    target_patterns:
      - user_attribute_demographic
    cache_embedding_path: ./results/e2e_sample/embedding_cache/demographic
    n_clusters: 2   # gender-related vs age-related attributes

  - name: psycho_behavioral
    out_dir: ./results/e2e_sample/clustering/psycho_behavioral
    target_patterns:
      - user_attribute_psycho_behavioral
    cache_embedding_path: ./results/e2e_sample/embedding_cache/psycho_behavioral
    n_clusters: 3   # grooming / pet ownership / kitchen hobbies

  - name: life_event
    out_dir: ./results/e2e_sample/clustering/life_event
    target_patterns:
      - user_attribute_life_event
    cache_embedding_path: ./results/e2e_sample/embedding_cache/life_event
    n_clusters: 2   # growing family vs relocation

# Merged output (all branches) is written here.
out_dir: ./results/e2e_sample/clustering
log_dir: ./logs/e2e_sample/clustering

model_name: ./models/Qwen3-Embedding-0.6B
torch_dtype: bfloat16
embedding_backend: qwen3_embedding
qwen3_max_length: 8192
enable_cache: True
batch_size: 100

query_path: ./results/e2e_sample/user

# Fixed-k clustering on raw embeddings; n_clusters is capped by the number of
# attributes of a branch, so a branch with fewer attributes still runs.
algorithm: kmeans
n_clusters: 3
seed: 3407
dimension_reduction: none

# Unused by k-means but required keys of the shared config schema.
minibatch_kmeans_batch_size: 1024
minibatch_kmeans_max_iter: 300
minibatch_kmeans_n_init: 10
minibatch_kmeans_max_no_improvement: 10
minibatch_kmeans_reassignment_ratio: 0.01
pca_n_components: 8
pca_random_state: 0
umap_n_components: 8
umap_min_dist: 0.1
umap_n_neighbors: 5
umap_metric: cosine
min_cluster_ratio: 0.01
min_samples: 2
metric: euclidean
cluster_selection_method: eom
hdbscan_n_jobs: -1
