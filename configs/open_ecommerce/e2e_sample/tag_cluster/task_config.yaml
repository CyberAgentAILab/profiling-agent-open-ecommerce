# E2E sample run: assign an LLM tag to every attribute cluster of the 10 sample products.
out_dir: ./results/e2e_sample/tag
log_dir: ./logs/e2e_sample/tag
# Latest output-*.json in this directory (the merged cluster_attribute output).
query_dir: ./results/e2e_sample/clustering

# cluster_attribute clusters each attribute group independently, so tag each
# group in its own cluster_id space.
cluster_id_namespace: per_pattern

# Representative attributes per cluster are picked by k-medoids over the
# embeddings cached by cluster_attribute (falls back to head if no cache).
sampling_method: kmedoids
cache_embed_dir: ./results/e2e_sample/embedding_cache
cache_embed_model: ./models/Qwen3-Embedding-0.6B

model_name: ./models/Qwen3.5-4B
# model_name: ./models/Qwen3.5-27B  # model used in the paper
torch_dtype: bfloat16
# max_new_tokens caps the response only (SamplingParams.max_tokens).
# max_model_len caps prompt + response (vLLM max_model_len).
max_new_tokens: 2048
max_model_len: 8192
enable_cache: True
enable_thinking: False

path_prompt_template: ./configs/prompt/open-ecommerce/tag_cluster.txt

json_schema_tag:
  - reasoning
  - tag

use_vllm: True
tensor_parallel_size: 1
trust_remote_code: True
seed: 3407
gpu_memory_utilization: 0.9
enforce_eager: True

batch_size: 100
debug_num_sample: 100000

begin:
end:
